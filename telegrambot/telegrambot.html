<script type="text/javascript">
    RED.nodes.registerType('telegram client config', {
        category: 'config',
        defaults: {
            botname: { value: '', required: true },
            verboselogging: { value: false, required: false },
            loginmode: { value: 'user', required: true },

            useproxy: { value: false, required: false },
            usewss: { value: false, required: false },
            devicemodel: { value: '', required: false },
            systemversion: { value: '', required: false },
            appversion: { value: '', required: false },
            floodsleepthreshold: {
                value: '',
                required: false,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 86400);
                },
            },

            host: { value: '', required: false },
            sockstype: { value: '5', required: false },
            port: {
                value: 6667,
                required: false,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 2147483);
                },
            },
            username: { value: 'anonymous', required: false },
            password: { value: '', required: false },
            secret: { value: '', required: false },
            mtproxy: { value: false, required: false },
            timeout: {
                value: 2,
                required: false,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 2147483);
                },
            },
        },
        credentials: {
            apiid: {
                value: 0,
                required: true,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 4294967295);
                },
            },
            apihash: { value: '', required: true },
            // `password`, so the runtime never sends the value to the editor: it hands over only
            // `has_session` and the field shows the __PWRD__ placeholder. The login panel keys off
            // "is it empty", which the placeholder answers correctly, and saving an untouched field
            // leaves the stored session alone.
            session: {
                type: 'password',
                value: '',
                required: true,
                validate: function (v) {
                    return v.length > 0;
                },
            },
            phonenumber: { value: '', required: true },
            // Not `password`: that name is already a *config* property holding the proxy password,
            // and two keys of the same name would bind to one #node-config-input-password element.
            twofapassword: { value: '', required: false },
            bottoken: { type: 'text' },
        },
        label: function () {
            return this.botname;
        },
        oneditprepare: function () {
            // polling or webhook
            let updateLoginMode = function () {
                let mode = $('#node-config-input-loginmode').val();
                if (mode == 'user') {
                    $('#phonenumber').show();
                    $('#twofapassword').show();
                    $('#bottoken').hide();
                } else {
                    $('#phonenumber').hide();
                    $('#twofapassword').hide();
                    $('#bottoken').show();
                }
            };
            updateLoginMode();
            $('#node-config-input-loginmode').change(updateLoginMode);

            // proxy  on / off
            let useproxy = function () {
                let mode = $('#node-config-input-useproxy').prop('checked');
                if (mode === false) {
                    $('#useproxy').hide();
                } else {
                    $('#useproxy').show();
                }
            };
            useproxy();
            $('#node-config-input-useproxy').change(useproxy);

            let login = function () {
                let apiId = $('#node-config-input-apiid').val();
                let apiHash = $('#node-config-input-apihash').val();
                let phoneNumber = $('#node-config-input-phonenumber').val();
                let password = $('#node-config-input-twofapassword').val();
                let botToken = $('#node-config-input-bottoken').val();
                let loginMode = $('#node-config-input-loginmode').val();
                let useProxy = $('#node-config-input-useproxy').prop('checked');
                let useWSS = $('#node-config-input-usewss').prop('checked');
                let devicemodel = $('#node-config-input-devicemodel').val();
                let systemversion = $('#node-config-input-systemversion').val();
                let appversion = $('#node-config-input-appversion').val();
                let proxy;

                if (useProxy) {
                    proxy = {
                        ip: $('#node-config-input-host').val(),
                        socksType: Number($('#node-config-input-sockstype').val()),
                        port: Number($('#node-config-input-port').val()),
                        username: $('#node-config-input-username').val(),
                        password: $('#node-config-input-password').val(),
                        secret: $('#node-config-input-secret').val(),
                        MTProxy: $('#node-config-input-mtproxy').prop('checked'),
                        timeout: Number($('#node-config-input-timeout').val()),
                    };
                }

                if (apiId !== '' && apiHash) {
                    let parameters = {
                        apiId: apiId,
                        apiHash: apiHash,
                        phoneNumber: phoneNumber,
                        password: password,
                        botToken: botToken,
                        loginMode: loginMode,
                        proxy: proxy,
                        useWSS: useWSS,
                        devicemodel: devicemodel,
                        systemversion: systemversion,
                        appversion: appversion,
                    };

                    $('#loginbuttontip').text('Login started: enter code in field below.');
                    $('#node-config-input-phonecode').val('');
                    $('#node-config-input-session').val('');
                    $.getJSON('node-red-node-telegrambot-login', parameters, function (data) {
                        if (data.session) {
                            $('#node-config-input-session').val(data.session);
                            $('#loginbuttontip').text(
                                'Click Login button to request code for login: code will be sent via your phone.'
                            );
                            $('#node-config-input-phonecode').val('');
                            $('#loginpanel').hide();
                        }

                        if (data.error) {
                            $('#node-config-input-session').val('');
                            $('#loginbuttontip').text('Login failed: ' + data.error);
                        }
                    });
                }
            };

            let setPhoneCode = function () {
                let phoneCode = $('#node-config-input-phonecode').val();
                if (phoneCode != '') {
                    $('#loginbuttontip').text('Signing in using phone code ....');
                    let parameters = {
                        phoneCode: phoneCode,
                    };
                    $.getJSON('node-red-node-telegrambot-setphonecode', parameters, function (data) {
                        // TODO:
                    });
                }
            };

            let setPassword = function () {
                let password = $('#node-config-input-twofapassword').val();
                if (password != '') {
                    $('#loginbuttontip').text('Signing in using password ....');
                    let parameters = {
                        password: password,
                    };
                    $.getJSON('node-red-node-telegrambot-setpassword', parameters, function (data) {
                        // TODO:
                    });
                }
            };

            let showLoginButton = function () {
                let session = $('#node-config-input-session').val();
                if (session === '') {
                    $('#loginpanel').show();
                } else {
                    $('#loginpanel').hide();
                }
            };

            // Entering the fields will not trigger anything: please use login button
            // $('#node-config-input-apiid').change(login);
            // $('#node-config-input-apihash').change(login);
            // $('#node-config-input-phonenumber').change(login);

            $('#node-config-input-phonecode').change(setPhoneCode);
            $('#node-config-input-twofapassword').change(setPassword);
            $('#node-config-input-session').change(showLoginButton);

            $('#loginbutton').click(function () {
                login();
            });

            showLoginButton();
        },
    });
</script>

<script type="text/x-red" data-help-name="telegram client config">
    <p>Holds the credentials for one Telegram account and owns the client that every receiver and
    sender using this config shares.</p>

    <h3>Login mode</h3>
    <p><b>user</b> signs in as the account owner (a userbot) with a phone number.
    <b>bot</b> signs in with a token from &#64;botfather. The login mode also decides which
    authentication the deployed flow uses, so switching it back and forth is safe even if a bot token
    is still stored.</p>

    <h3>Logging in</h3>
    <p>Create an API ID and API Hash at <i>my.telegram.org</i> under <i>API Development Tools</i>, then
    press <b>Login</b>. Telegram sends a phone code; enter it in the <b>Phone-Code</b> field. If your
    account has two-step verification enabled, also fill in <b>Password</b> in the login panel.</p>
    <p>The login runs once and produces a <b>session string</b>, which is what the deployed flow
    actually uses. Treat it like a password: it authenticates the whole account.</p>

    <h3>Two passwords</h3>
    <p>These are different values and easy to mix up:</p>
    <ul>
        <li><b>Password</b> in the login panel is your account's two-step-verification password.</li>
        <li><b>Password</b> under <i>Proxy Options</i> is the password of the SOCKS proxy.</li>
    </ul>
    <p>Before version 0.1.11 both shared one input field. If you had entered an account password, it
    now appears prefilled in the proxy field — clear it there and re-enter it in the login panel.</p>

    <h3>Device fields</h3>
    <p><b>Device Model</b>, <b>System Version</b> and <b>App Version</b> are optional. Left empty,
    GramJS reports the host's own values. Setting them makes the session look like a specific client,
    which some users prefer to reduce the risk of the account being flagged.</p>

    <h3>Flood wait</h3>
    <p>When Telegram throttles you it answers with a required wait. Waits up to <b>Flood wait</b>
    seconds are slept through silently and the call then retried; longer ones are reported as an error on
    the sender node, which also shows <i>flood wait Ns</i> on the canvas. Default is 60 seconds.
    A lower value fails fast; a higher one hides throttling. <b>0</b> never sleeps.</p>
    <p>Silent waits below the threshold produce no error and no status change — the flow just pauses.
    Turn on <b>Verbose logging</b> to see them in the Node-RED log.</p>
    <p>Being throttled is a warning sign: sustained flooding is what gets userbot accounts limited or
    banned. Treat frequent flood waits as a reason to slow the flow down, not to raise this value.</p>
</script>

    });

<script type="text/x-red" data-help-name="telegram client receiver">
    <p>A telegram node that triggers the output when some message event is received from the chat.</p>
    <p>Select which event types to subscribe to, and optionally narrow them down with the filters.</p>

    <h3>Outputs</h3>
    <p>1. Standard Output: Event message is sent to output.</p>

    <h3>Filters</h3>
    <p>Filtering is done by Telegram's event builders, not downstream, so traffic you are not
    interested in never reaches the flow at all. Leave a field empty to not filter on it.</p>
    <ul>
        <li><b>Chats</b> &mdash; comma separated usernames or ids. With <b>Exclude</b> ticked the list
        becomes an exclude list.</li>
        <li><b>Direction</b> &mdash; only incoming or only outgoing messages. These are mutually
        exclusive in Telegram, which is why this is one choice rather than two checkboxes.</li>
        <li><b>From users</b> &mdash; filters by <i>sender</i>, independently of the chat.</li>
        <li><b>Pattern</b> &mdash; a regular expression the message text must match.</li>
    </ul>
    <p>Not every filter applies to every event type, because Telegram's builders differ:</p>
    <ul>
        <li><b>New messages</b> and <b>Edited messages</b> support all of them.</li>
        <li><b>Callback query</b> supports Chats, Exclude and Pattern.</li>
        <li><b>Deleted messages</b> and <b>Albums</b> support Chats and Exclude only.</li>
        <li><b>Raw events</b> support none &mdash; raw updates arrive before Telegram resolves
        entities, so there is nothing to match a chat against.</li>
    </ul>
    <p>An invalid <b>Pattern</b> is rejected in the editor. If one reaches the runtime anyway, the node
    reports an error and subscribes to nothing rather than silently forwarding everything.</p>
</script>
