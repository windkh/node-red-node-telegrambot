<script type="text/javascript">
    RED.nodes.registerType('telegram client config', {
        category: 'config',
        defaults: {
            botname: { value: '', required: true },
            verboselogging: { value: false, required: false },
            loginmode: { value: 'user', required: true },

            useproxy: { value: false, required: false },
            usewss: { value: false, required: false },
            devicemodel: { value: '', required: false },
            systemversion: { value: '', required: false },
            appversion: { value: '', required: false },
            floodsleepthreshold: {
                value: '',
                required: false,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 86400);
                },
            },
            parsemode: { value: '', required: false },

            host: { value: '', required: false },
            sockstype: { value: '5', required: false },
            port: {
                value: 6667,
                required: false,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 2147483);
                },
            },
            username: { value: 'anonymous', required: false },
            password: { value: '', required: false },
            secret: { value: '', required: false },
            mtproxy: { value: false, required: false },
            timeout: {
                value: 2,
                required: false,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 2147483);
                },
            },
        },
        credentials: {
            apiid: {
                value: 0,
                required: true,
                validate: function (v) {
                    return v === '' || (RED.validators.number(v) && v >= 0 && v <= 4294967295);
                },
            },
            // All the secrets are `password`, so the runtime hands the editor only a `has_<name>` flag
            // and never the value. The login posts the __PWRD__ placeholder for these and the route
            // substitutes what is stored — see telegrambot/lib/login-credentials.js.
            apihash: { type: 'password', value: '', required: true },
            // `password`, so the runtime never sends the value to the editor: it hands over only
            // `has_session` and the field shows the __PWRD__ placeholder. The login panel keys off
            // "is it empty", which the placeholder answers correctly, and saving an untouched field
            // leaves the stored session alone.
            session: {
                type: 'password',
                value: '',
                required: true,
                validate: function (v) {
                    return v.length > 0;
                },
            },
            phonenumber: { value: '', required: true },
            // Not `password`: that name is already a *config* property holding the proxy password,
            // and two keys of the same name would bind to one #node-config-input-password element.
            twofapassword: { type: 'password', value: '', required: false },
            bottoken: { type: 'password' },
        },
        label: function () {
            return this.botname;
        },
        oneditprepare: function () {
            // The login routes look stored credentials up by node id, so they can substitute whatever
            // the editor could not send: a `password`-typed credential comes back as the __PWRD__
            // placeholder, never as its value.
            let nodeId = this.id;

            // POST, not GET: these bodies carry the api hash, phone number, 2FA password and bot token,
            // and a query string would put them in access logs, browser history and Referer headers.
            let postJson = function (route, parameters, done) {
                $.ajax({
                    url: route,
                    type: 'POST',
                    contentType: 'application/json; charset=utf-8',
                    data: JSON.stringify(parameters),
                    dataType: 'json',
                    success: done,
                });
            };

            // polling or webhook
            let updateLoginMode = function () {
                let mode = $('#node-config-input-loginmode').val();
                if (mode == 'user') {
                    $('#phonenumber').show();
                    $('#twofapassword').show();
                    $('#bottoken').hide();
                } else {
                    $('#phonenumber').hide();
                    $('#twofapassword').hide();
                    $('#bottoken').show();
                }
            };
            updateLoginMode();
            $('#node-config-input-loginmode').change(updateLoginMode);

            // proxy  on / off
            let useproxy = function () {
                let mode = $('#node-config-input-useproxy').prop('checked');
                if (mode === false) {
                    $('#useproxy').hide();
                } else {
                    $('#useproxy').show();
                }
            };
            useproxy();
            $('#node-config-input-useproxy').change(useproxy);

            let login = function () {
                let apiId = $('#node-config-input-apiid').val();
                let apiHash = $('#node-config-input-apihash').val();
                let phoneNumber = $('#node-config-input-phonenumber').val();
                let password = $('#node-config-input-twofapassword').val();
                let botToken = $('#node-config-input-bottoken').val();
                let loginMode = $('#node-config-input-loginmode').val();
                let useProxy = $('#node-config-input-useproxy').prop('checked');
                let useWSS = $('#node-config-input-usewss').prop('checked');
                let devicemodel = $('#node-config-input-devicemodel').val();
                let systemversion = $('#node-config-input-systemversion').val();
                let appversion = $('#node-config-input-appversion').val();
                let proxy;

                if (useProxy) {
                    proxy = {
                        ip: $('#node-config-input-host').val(),
                        socksType: Number($('#node-config-input-sockstype').val()),
                        port: Number($('#node-config-input-port').val()),
                        username: $('#node-config-input-username').val(),
                        password: $('#node-config-input-password').val(),
                        secret: $('#node-config-input-secret').val(),
                        MTProxy: $('#node-config-input-mtproxy').prop('checked'),
                        timeout: Number($('#node-config-input-timeout').val()),
                    };
                }

                if (apiId !== '' && apiHash) {
                    let parameters = {
                        id: nodeId,
                        apiId: apiId,
                        apiHash: apiHash,
                        phoneNumber: phoneNumber,
                        password: password,
                        botToken: botToken,
                        loginMode: loginMode,
                        proxy: proxy,
                        useWSS: useWSS,
                        devicemodel: devicemodel,
                        systemversion: systemversion,
                        appversion: appversion,
                    };

                    $('#loginbuttontip').text('Login started: enter code in field below.');
                    $('#node-config-input-phonecode').val('');
                    $('#node-config-input-session').val('');
                    postJson('node-red-node-telegrambot-login', parameters, function (data) {
                        if (data.session) {
                            $('#node-config-input-session').val(data.session);
                            $('#loginbuttontip').text(
                                'Click Login button to request code for login: code will be sent via your phone.'
                            );
                            $('#node-config-input-phonecode').val('');
                            $('#loginpanel').hide();
                        }

                        if (data.error) {
                            $('#node-config-input-session').val('');
                            $('#loginbuttontip').text('Login failed: ' + data.error);
                        }
                    });
                }
            };

            let setPhoneCode = function () {
                let phoneCode = $('#node-config-input-phonecode').val();
                if (phoneCode != '') {
                    $('#loginbuttontip').text('Signing in using phone code ....');
                    let parameters = {
                        phoneCode: phoneCode,
                    };
                    postJson('node-red-node-telegrambot-setphonecode', parameters, function (data) {
                        // TODO:
                    });
                }
            };

            let setPassword = function () {
                let password = $('#node-config-input-twofapassword').val();
                if (password != '') {
                    $('#loginbuttontip').text('Signing in using password ....');
                    let parameters = {
                        password: password,
                    };
                    postJson('node-red-node-telegrambot-setpassword', parameters, function (data) {
                        // TODO:
                    });
                }
            };

            let showLoginButton = function () {
                let session = $('#node-config-input-session').val();
                if (session === '') {
                    $('#loginpanel').show();
                } else {
                    $('#loginpanel').hide();
                }
            };

            // Entering the fields will not trigger anything: please use login button
            // $('#node-config-input-apiid').change(login);
            // $('#node-config-input-apihash').change(login);
            // $('#node-config-input-phonenumber').change(login);

            $('#node-config-input-phonecode').change(setPhoneCode);
            $('#node-config-input-twofapassword').change(setPassword);
            $('#node-config-input-session').change(showLoginButton);

            $('#loginbutton').click(function () {
                login();
            });

            showLoginButton();
        },
    });
</script>

<script type="text/x-red" data-help-name="telegram client config">
        <p>Holds the credentials for one Telegram account and owns the client that every receiver and
        sender using this config shares.</p>

        <h3>Login mode</h3>
        <p><b>user</b> signs in as the account owner (a userbot) with a phone number.
        <b>bot</b> signs in with a token from &#64;botfather. The login mode also decides which
        authentication the deployed flow uses, so switching it back and forth is safe even if a bot token
        is still stored.</p>

        <h3>Logging in</h3>
        <p>Create an API ID and API Hash at <i>my.telegram.org</i> under <i>API Development Tools</i>, then
        press <b>Login</b>. Telegram sends a phone code; enter it in the <b>Phone-Code</b> field. If your
        account has two-step verification enabled, also fill in <b>Password</b> in the login panel.</p>
        <p>The login runs once and produces a <b>session string</b>, which is what the deployed flow
        actually uses. Treat it like a password: it authenticates the whole account.</p>

        <h3>Two passwords</h3>
        <p>These are different values and easy to mix up:</p>
        <ul>
            <li><b>Password</b> in the login panel is your account's two-step-verification password.</li>
            <li><b>Password</b> under <i>Proxy Options</i> is the password of the SOCKS proxy.</li>
        </ul>
        <p>Before version 0.1.11 both shared one input field. If you had entered an account password, it
        now appears prefilled in the proxy field — clear it there and re-enter it in the login panel.</p>

        <h3>Device fields</h3>
        <p><b>Device Model</b>, <b>System Version</b> and <b>App Version</b> are optional. Left empty,
        GramJS reports the host's own values. Setting them makes the session look like a specific client,
        which some users prefer to reduce the risk of the account being flagged.</p>

        <h3>Parse mode</h3>
        <p>Off by default: message text is sent exactly as given. Switching it on makes Telegram interpret
        the text as <b>Markdown</b>, <b>MarkdownV2</b> or <b>HTML</b>, so <code>*bold*</code> arrives bold.</p>
        <p><b>This applies to every message this client sends.</b> Once it is on, any text your flow did not
        write itself &mdash; a user's name, a value from an API, an error message &mdash; has to be escaped,
        or a stray <code>*</code>, <code>_</code> or <code>&lt;</code> will render wrongly or make Telegram
        reject the message. If only some of your messages are formatted, leave this off and set
        <code>parseMode</code> per message instead:</p>
        <pre>msg.payload = {
        func: 'sendMessage',
        args: ['someone', { message: '*bold*', parseMode: 'md' }],
    };</pre>

        <h3>Flood wait</h3>
        <p>When Telegram throttles you it answers with a required wait. Waits up to <b>Flood wait</b>
        seconds are slept through silently and the call then retried; longer ones are reported as an error on
        the sender node, which also shows <i>flood wait Ns</i> on the canvas. Default is 60 seconds.
        A lower value fails fast; a higher one hides throttling. <b>0</b> never sleeps.</p>
        <p>Silent waits below the threshold produce no error and no status change — the flow just pauses.
        Turn on <b>Verbose logging</b> to see them in the Node-RED log.</p>
        <p>Being throttled is a warning sign: sustained flooding is what gets userbot accounts limited or
        banned. Treat frequent flood waits as a reason to slow the flow down, not to raise this value.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('telegram client receiver', {
        category: 'telegram',
        color: '#3BABDD',
        defaults: {
            name: { value: '' },
            bot: { value: '', type: 'telegram client config', required: true },
            sendrawevents: { value: false, required: false },
            sendnewmessage: { value: false, required: false },
            sendeditedmessage: { value: false, required: false },
            senddeletedmessage: { value: false, required: false },
            sendalbum: { value: false, required: false },
            sendcallbackquery: { value: false, required: false },
            chats: { value: '', required: false },
            blacklistchats: { value: false, required: false },
            direction: { value: 'any', required: false },
            fromusers: { value: '', required: false },
            pattern: {
                value: '',
                required: false,
                validate: function (v) {
                    let valid = true;
                    if (v !== '') {
                        try {
                            new RegExp(v);
                        } catch (error) {
                            valid = false;
                        }
                    }
                    return valid;
                },
            },
        },
        inputs: 0,
        outputs: 1,
        icon: 'telegram.png',
        paletteLabel: 'client receiver',
        label: function () {
            return this.name || 'Telegram client receiver';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {},
    });
</script>

        <label for="node-input-direction"><i class="fa fa-exchange"></i> Direction</label>
        <select id="node-input-direction">
            <option value="any">any</option>
            <option value="incoming">incoming only</option>
            <option value="outgoing">outgoing only</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-fromusers"><i class="fa fa-user"></i> From users</label>
        <input type="text" id="node-input-fromusers" placeholder="(Comma separated usernames or ids of senders.)">
    </div>

    <div class="form-row">

<script type="text/x-red" data-help-name="telegram client receiver">
    <p>A telegram node that triggers the output when some message event is received from the chat.</p>
    <p>Select which event types to subscribe to, and optionally narrow them down with the filters.</p>

    <h3>Outputs</h3>
    <p>1. Standard Output: Event message is sent to output.</p>

    <h3>Filters</h3>
    <p>Filtering is done by Telegram's event builders, not downstream, so traffic you are not
    interested in never reaches the flow at all. Leave a field empty to not filter on it.</p>
    <ul>
        <li><b>Chats</b> &mdash; comma separated usernames or ids. With <b>Exclude</b> ticked the list
        becomes an exclude list.</li>
        <li><b>Direction</b> &mdash; only incoming or only outgoing messages. These are mutually
        exclusive in Telegram, which is why this is one choice rather than two checkboxes.</li>
        <li><b>From users</b> &mdash; filters by <i>sender</i>, independently of the chat.</li>
        <li><b>Pattern</b> &mdash; a regular expression the message text must match.</li>
    </ul>
    <p>Not every filter applies to every event type, because Telegram's builders differ:</p>
    <ul>
        <li><b>New messages</b> and <b>Edited messages</b> support all of them.</li>
        <li><b>Callback query</b> supports Chats, Exclude and Pattern.</li>
        <li><b>Deleted messages</b> and <b>Albums</b> support Chats and Exclude only.</li>
        <li><b>Raw events</b> support none &mdash; raw updates arrive before Telegram resolves
        entities, so there is nothing to match a chat against.</li>
    </ul>
    <p>An invalid <b>Pattern</b> is rejected in the editor. If one reaches the runtime anyway, the node
    reports an error and subscribes to nothing rather than silently forwarding everything.</p>
</script>

<script type="text/x-red" data-help-name="telegram client sender">
    <p>A telegram node that sends messaged to a chat.</p>
    <p>The node receives data and sends it to the telegram server.</p>

    <h3>Inputs</h3>
    <p>1. Standard Input: receives a message object containing the following fields:</p>
    <p>The <code>msg.payload</code> must be an object that contains the following properties:</p>
        <ul>
        <li><code>api</code> the api to call e.g. "messages" (see https://gram.js.org/tl/messages/SendMessage)</li>
        <li><code>func</code> the function of the api to call e.g. "SendMessage" (see https://gram.js.org/tl/messages/SendMessage)</li>
        <li><code>args</code> arguments of the function.</li>
        </ul>
    <h3>Outputs</h3>
    <p>1. Standard Output: returns the result of the api call.</p>

    <h3>Two calling conventions</h3>
    <p>Leaving <code>api</code> out calls a method on the GramJS client directly, with <code>args</code>
    spread as its arguments &mdash; so <code>args</code> must be an <b>array</b>:</p>
    <pre>msg.payload = { func: 'sendMessage', args: ['someone', { message: 'Hello' }] };</pre>
    <p>Setting <code>api</code> builds a raw MTProto request, which takes a single options
    <b>object</b>:</p>
    <pre>msg.payload = { api: 'messages', func: 'SendMessage', args: { peer: 'someone', ... } };</pre>

    <h3>Addressing a chat or user</h3>
    <p>You do not have to resolve peers yourself &mdash; both conventions accept a username and let
    GramJS look it up. But <b>how</b> you address a peer decides whether it keeps working:</p>
    <ul>
        <li>A <b>username</b> or an invite link always works.</li>
        <li>A <b>numeric id</b> works only while that peer is in the session's entity cache. That cache
        is held in memory and lost on every restart, so a flow that works while you build it can fail
        after a redeploy with <i>Could not find the input entity for &hellip;</i></li>
        <li>A <b>phone number</b> works only for people in your account's contacts.</li>
    </ul>
    <p>Address peers by username and this never comes up. If you only have an id, resolve it once with
    <code>getEntity</code> in the same flow and pass the result on.</p>

    <h3>Useful client methods</h3>
    <p>Anything on the client is reachable. The ones worth knowing:</p>
    <ul>
        <li><b>Sending</b> &mdash; sendMessage, sendFile, forwardMessages, editMessage, deleteMessages</li>
        <li><b>Chats</b> &mdash; pinMessage, unpinMessage, markAsRead, kickParticipant</li>
        <li><b>Reading</b> &mdash; getMessages, getDialogs, getParticipants, iterMessages, iterDialogs</li>
        <li><b>Media</b> &mdash; downloadMedia, downloadFile, downloadProfilePhoto, uploadFile</li>
        <li><b>Entities</b> &mdash; getEntity, getInputEntity, getPeerId</li>
        <li><b>Account</b> &mdash; getMe, isBot, isUserAuthorized, checkAuthorization</li>
    </ul>
    <p>The <code>iter*</code> methods return async iterators, which do not survive being placed in
    <code>msg.payload</code>. Prefer the non-iterating variants until dedicated support exists.</p>
    <p><b>Careful:</b> the client is shared by every node using the same config. Connection and
    authentication methods &mdash; connect, disconnect, destroy, start, signIn&hellip;, addEventHandler
    &mdash; are reachable too, and calling them from a flow will disrupt the other nodes.</p>

    <h3>Details</h3>
    <p>Please refer to the examples in the examples folder and the readme. The full method and TL
    reference is at https://gram.js.org/.</p>
</script>

<script type="text/x-red" data-help-name="telegram client download">
    <p>Downloads the media attached to a received message &mdash; a photo, video, voice note or
    document.</p>

    <h3>Inputs</h3>
    <p>Wire this node to a <i>Telegram client receiver</i> output. It accepts what the receiver emits, so
    no unwrapping is needed. A message without media is reported as an error.</p>

    <h3>Outputs</h3>
    <ul>
        <li><code>msg.payload</code> &mdash; the file as a Buffer</li>
        <li><code>msg.filename</code> &mdash; the document's own name, or a generated one</li>
        <li><code>msg.mimetype</code> &mdash; the document's mime type (photos are always
        <code>image/jpeg</code>)</li>
        <li><code>msg.telegram</code> &mdash; the original message, so the sender and chat stay
        reachable</li>
    </ul>
    <p>That is the shape <b>file out</b> and <b>http response</b> already expect, so they can follow
    directly.</p>

    <h3>Thumbnail</h3>
    <p>Leave empty to download the media itself. An index picks a thumbnail instead &mdash; <code>0</code>
    is the smallest available size. Useful when you want a preview rather than a 40 MB original.</p>

    <h3>Max size</h3>
    <p>A download larger than this many megabytes is refused with an error instead of being read into
    memory, which is what protects the runtime from a large video. <code>0</code> or empty disables the
    check.</p>
    <p>The size is not known in advance for every kind of media. When it cannot be determined the check
    is skipped, so this is a safeguard rather than a guarantee.</p>
</script>

<script type="text/x-red" data-help-name="telegram client upload">
    <p>Sends a file to a chat &mdash; the mirror of the <i>Telegram client download</i> node.</p>

    <h3>Inputs</h3>
    <ul>
        <li><code>msg.payload</code> &mdash; the file, either a <b>Buffer</b> or a <b>path</b> as a
        string. This is what <b>file in</b> and <b>http request</b> produce, so they can feed this node
        directly.</li>
        <li><code>msg.filename</code> &mdash; <b>required when the payload is a Buffer</b>, because a
        Buffer carries no name of its own. Without it the file would arrive in the chat called
        <i>unnamed</i>, so the node reports an error instead. A path needs no filename.</li>
        <li><code>msg.peer</code> &mdash; overrides <b>Send to</b>.</li>
        <li><code>msg.caption</code> &mdash; overrides <b>Caption</b>.</li>
    </ul>

    <h3>Outputs</h3>
    <p><code>msg.payload</code> becomes the message Telegram created, so it can be replied to, edited or
    pinned by a following node. The Buffer is not carried through &mdash; it has served its purpose.</p>

    <h3>Addressing</h3>
    <p>A <b>username</b> always works. A numeric id only works while that peer is in the session's
    entity cache, which is lost on restart &mdash; see the sender node's help for the details.</p>

    <h3>Size</h3>
    <p>A Buffer has to fit in memory before it can be sent. For large files pass a <b>path</b> instead:
    Telegram reads it from disk rather than the flow holding the whole thing.</p>
</script>
